[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gardenrec"
version = "1.0.0"
description = "Reproducible explicit rating prediction and Top-10 recommendation experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
gardenrec = "gardenrec.__main__:main"

[tool.setuptools.packages.find]
include = ["gardenrec*"]
